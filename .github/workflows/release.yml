name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: --target x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: taskflow/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: taskflow/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: taskflow
        run: npm ci

      - name: Run tests
        working-directory: taskflow
        run: npx vitest run

      - name: Extract tag annotation body
        id: tag_body
        shell: bash
        run: |
          BODY=$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Inject version
        id: version
        shell: bash
        working-directory: taskflow
        run: |
          eval $(node scripts/inject-version.cjs)
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "APP_COMMIT_SHA=$APP_COMMIT_SHA" >> $GITHUB_ENV
          echo "APP_BUILD_DATE=$APP_BUILD_DATE" >> $GITHUB_ENV
          echo "version=$APP_VERSION" >> $GITHUB_OUTPUT

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APP_VERSION: ${{ env.APP_VERSION }}
          APP_COMMIT_SHA: ${{ env.APP_COMMIT_SHA }}
          APP_BUILD_DATE: ${{ env.APP_BUILD_DATE }}
        with:
          projectPath: taskflow
          tagName: v__VERSION__
          releaseName: Taskflow v__VERSION__
          releaseBody: ${{ steps.tag_body.outputs.body }}
          releaseDraft: false
          prerelease: false
          owner: Mimo01
          repo: taskflow-releases
          releaseCommitish: main
          args: ${{ matrix.args }}

  update-readme:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Update README in releases repo
        env:
          TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/Mimo01/taskflow-releases.git
          cd taskflow-releases
          cat > README.md <<EOF
          # Taskflow

          ## Download

          ### macOS
          - [Taskflow_${VERSION}_universal.dmg](https://github.com/Mimo01/taskflow-releases/releases/latest/download/Taskflow_${VERSION}_universal.dmg)

          ### Windows
          - [Taskflow_${VERSION}_x64-setup.exe](https://github.com/Mimo01/taskflow-releases/releases/latest/download/Taskflow_${VERSION}_x64-setup.exe)
          - [Taskflow_${VERSION}_x64_en-US.msi](https://github.com/Mimo01/taskflow-releases/releases/latest/download/Taskflow_${VERSION}_x64_en-US.msi)

          ### Linux
          - [Taskflow_${VERSION}_amd64.deb](https://github.com/Mimo01/taskflow-releases/releases/latest/download/Taskflow_${VERSION}_amd64.deb) (Debian/Ubuntu)
          - [Taskflow-${VERSION}-1.x86_64.rpm](https://github.com/Mimo01/taskflow-releases/releases/latest/download/Taskflow-${VERSION}-1.x86_64.rpm) (Fedora/RHEL)
          - [Taskflow_${VERSION}_amd64.AppImage](https://github.com/Mimo01/taskflow-releases/releases/latest/download/Taskflow_${VERSION}_amd64.AppImage) (AppImage)
          EOF
          sed -i 's/^          //' README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "docs: update download links to v${VERSION}" && git push)
