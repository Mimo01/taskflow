name: Release Build

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.6.3)"
        required: true
      platform:
        description: "Platform to build (all, macos, linux, windows)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - macos
          - linux
          - windows

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os_name: linux
            rust_targets: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            os_name: windows
            rust_targets: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: universal-apple-darwin
            os_name: macos
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    defaults:
      run:
        working-directory: taskflow

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Check if this platform should run
        id: should_run
        shell: bash
        working-directory: .
        run: |
          PLATFORM="${{ github.event.inputs.platform || 'all' }}"
          OS_NAME="${{ matrix.os_name }}"
          if [ "$PLATFORM" = "all" ] || [ "$PLATFORM" = "$OS_NAME" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping $OS_NAME build (requested: $PLATFORM)"
          fi

      - name: Resolve version
        if: steps.should_run.outputs.run == 'true'
        id: version
        shell: bash
        working-directory: .
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          BARE=$(echo "$TAG" | sed 's/^v//')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "bare=$BARE" >> "$GITHUB_OUTPUT"
          git tag "$TAG" 2>/dev/null || true

      - name: Install Linux dependencies
        if: steps.should_run.outputs.run == 'true' && matrix.os_name == 'linux'
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libappindicator3-dev librsvg2-dev patchelf

      - name: Install macOS Rust targets for universal build
        if: steps.should_run.outputs.run == 'true' && matrix.os_name == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Setup Node.js
        if: steps.should_run.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: taskflow/package-lock.json

      - name: Setup Rust
        if: steps.should_run.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        if: steps.should_run.outputs.run == 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: taskflow/src-tauri

      - name: Install frontend dependencies
        if: steps.should_run.outputs.run == 'true'
        run: npm ci

      - name: Inject version
        if: steps.should_run.outputs.run == 'true'
        shell: bash
        run: eval "$(node scripts/inject-version.cjs)"

      - name: Build frontend
        if: steps.should_run.outputs.run == 'true'
        run: npm run build

      - name: Build Tauri app
        if: steps.should_run.outputs.run == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.target }}

      - name: Collect Linux artifacts
        if: steps.should_run.outputs.run == 'true' && matrix.os_name == 'linux'
        shell: bash
        working-directory: .
        run: |
          VERSION="${{ steps.version.outputs.bare }}"
          BUNDLE="taskflow/src-tauri/target/${{ matrix.target }}/release/bundle"
          echo "Bundle dir contents:"
          find "$BUNDLE" -type f -name "*${VERSION}*" 2>/dev/null | sort || true
          mkdir -p artifacts
          # Copy all AppImage artifacts (updater uses .AppImage + .sig)
          cp "$BUNDLE"/appimage/*AppImage artifacts/ 2>/dev/null || true
          cp "$BUNDLE"/appimage/*AppImage.sig artifacts/ 2>/dev/null || true
          cp "$BUNDLE"/appimage/*AppImage.tar.gz artifacts/ 2>/dev/null || true
          cp "$BUNDLE"/appimage/*AppImage.tar.gz.sig artifacts/ 2>/dev/null || true
          # Copy installers
          cp "$BUNDLE"/deb/*_amd64.deb artifacts/ 2>/dev/null || true
          echo "Collected artifacts:"
          ls -la artifacts/

      - name: Collect Windows artifacts
        if: steps.should_run.outputs.run == 'true' && matrix.os_name == 'windows'
        shell: bash
        working-directory: .
        run: |
          VERSION="${{ steps.version.outputs.bare }}"
          BUNDLE="taskflow/src-tauri/target/${{ matrix.target }}/release/bundle"
          echo "Bundle dir contents:"
          find "$BUNDLE" -type f -name "*${VERSION}*" 2>/dev/null | sort || true
          mkdir -p artifacts
          # Copy updater archives
          cp "$BUNDLE"/nsis/*nsis.zip artifacts/ 2>/dev/null || true
          cp "$BUNDLE"/nsis/*nsis.zip.sig artifacts/ 2>/dev/null || true
          # Copy installers
          cp "$BUNDLE"/nsis/*setup.exe artifacts/ 2>/dev/null || true
          cp "$BUNDLE"/nsis/*setup.exe.sig artifacts/ 2>/dev/null || true
          cp "$BUNDLE"/msi/*.msi artifacts/ 2>/dev/null || true
          cp "$BUNDLE"/msi/*.msi.sig artifacts/ 2>/dev/null || true
          echo "Collected artifacts:"
          ls -la artifacts/

      - name: Collect macOS artifacts
        if: steps.should_run.outputs.run == 'true' && matrix.os_name == 'macos'
        shell: bash
        working-directory: .
        run: |
          VERSION="${{ steps.version.outputs.bare }}"
          BUNDLE="taskflow/src-tauri/target/universal-apple-darwin/release/bundle"
          echo "Bundle dir contents:"
          find "$BUNDLE" -type f 2>/dev/null | sort || true
          mkdir -p artifacts
          cp "$BUNDLE"/dmg/Taskflow_${VERSION}_universal.dmg artifacts/ 2>/dev/null || true
          cp "$BUNDLE"/macos/Taskflow.app.tar.gz artifacts/ 2>/dev/null || true
          cp "$BUNDLE"/macos/Taskflow.app.tar.gz.sig artifacts/ 2>/dev/null || true
          echo "Collected artifacts:"
          ls -la artifacts/

      - name: Upload artifacts
        if: steps.should_run.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os_name }}-artifacts
          path: artifacts/*

  create-release:
    needs: build
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          BARE=$(echo "$TAG" | sed 's/^v//')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "bare=$BARE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release on taskflow-releases
        id: create
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_REPO_PAT }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.bare }}"

          # Extract tag annotation body for release notes
          TAG_BODY=$(git tag -l --format='%(contents:body)' "$TAG")
          TAG_BODY_JSON=$(printf '%s' "$TAG_BODY" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")

          RESPONSE=$(curl -s -X POST \
            -H "Authorization: token $RELEASES_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/Mimo01/taskflow-releases/releases" \
            -d "{
              \"tag_name\": \"$TAG\",
              \"target_commitish\": \"main\",
              \"name\": \"Taskflow $TAG\",
              \"body\": $TAG_BODY_JSON,
              \"draft\": false,
              \"prerelease\": false
            }")

          RELEASE_ID=$(python3 -c "
          import sys, json
          data = json.loads(sys.argv[1], strict=False)
          if 'id' not in data:
              print('Error creating release. Response:', file=sys.stderr)
              print(json.dumps(data, indent=2), file=sys.stderr)
              sys.exit(1)
          print(data['id'])
          " "$RESPONSE")

          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "Created release ID: $RELEASE_ID"
          echo "URL: https://github.com/Mimo01/taskflow-releases/releases/tag/$TAG"

  upload-to-releases:
    needs: [build, create-release]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          BARE=$(echo "$TAG" | sed 's/^v//')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "bare=$BARE" >> "$GITHUB_OUTPUT"
          git tag "$TAG" 2>/dev/null || true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: List artifacts
        run: find all-artifacts -type f | sort

      - name: Get release ID
        id: release
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_REPO_PAT }}
        shell: bash
        run: |
          RELEASE_ID="${{ needs.create-release.outputs.release_id }}"
          if [ -z "$RELEASE_ID" ]; then
            TAG="${{ steps.version.outputs.tag }}"
            echo "create-release output empty — looking up existing release for $TAG..."
            RELEASE_ID=$(curl -s -H "Authorization: token $RELEASES_TOKEN" \
              "https://api.github.com/repos/Mimo01/taskflow-releases/releases/tags/$TAG" | \
              python3 -c "import sys,json; d=json.load(sys.stdin); print(d['id']) if 'id' in d else (print('Error:',d,file=__import__('sys').stderr) or exit(1))")
          fi
          echo "id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "Release ID: $RELEASE_ID"

      - name: Upload artifacts to taskflow-releases
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_REPO_PAT }}
        shell: bash
        run: |
          RELEASE_ID="${{ steps.release.outputs.id }}"
          UPLOAD_BASE="https://uploads.github.com/repos/Mimo01/taskflow-releases/releases/$RELEASE_ID/assets"
          API_BASE="https://api.github.com/repos/Mimo01/taskflow-releases/releases"

          # Get existing assets to delete duplicates
          EXISTING_ASSETS=$(curl -s -H "Authorization: token $RELEASES_TOKEN" \
            "$API_BASE/$RELEASE_ID/assets")

          for file in all-artifacts/*/*; do
            [ -f "$file" ] || continue
            NAME=$(basename "$file")
            # Delete existing asset with same name if present
            OLD_ID=$(python3 -c "
          import sys, json
          assets = json.loads(sys.argv[1], strict=False)
          found = [a['id'] for a in assets if a['name'] == sys.argv[2]]
          print(found[0] if found else '')
          " "$EXISTING_ASSETS" "$NAME")
            if [ -n "$OLD_ID" ]; then
              echo "Replacing existing $NAME (asset $OLD_ID)..."
              curl -s -X DELETE -H "Authorization: token $RELEASES_TOKEN" \
                "$API_BASE/assets/$OLD_ID"
            fi
            echo "Uploading $NAME..."
            RESPONSE=$(curl -s -X POST \
              -H "Authorization: token $RELEASES_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              "$UPLOAD_BASE?name=$NAME" \
              --data-binary @"$file")
            python3 -c "
          import sys, json
          data = json.loads(sys.argv[1], strict=False)
          if 'id' not in data:
              print('Error:', json.dumps(data, indent=2), file=sys.stderr)
              sys.exit(1)
          print('  OK:', data.get('browser_download_url', '(no url)'))
          " "$RESPONSE"
          done

      - name: Generate and upload latest.json
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_REPO_PAT }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.bare }}"
          TAG="${{ steps.version.outputs.tag }}"
          RELEASE_ID="${{ steps.release.outputs.id }}"
          API_BASE="https://api.github.com/repos/Mimo01/taskflow-releases/releases"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Extract release notes from git tag
          git fetch --tags 2>/dev/null || true
          TAG_BODY=$(git tag -l --format='%(contents:body)' "$TAG" 2>/dev/null || echo "")

          cat > /tmp/build-latest.py << 'PYEOF'
          import json, os, sys, glob
          version = sys.argv[1]
          tag = sys.argv[2]
          pub_date = sys.argv[3]
          notes_file = sys.argv[4]

          with open(notes_file) as f:
              notes = f.read().strip()

          base_url = f"https://github.com/Mimo01/taskflow-releases/releases/download/{tag}"
          platforms = {}

          # macOS universal
          macos_sig_path = "all-artifacts/macos-artifacts/Taskflow.app.tar.gz.sig"
          if os.path.exists(macos_sig_path):
              with open(macos_sig_path) as f:
                  macos_sig = f.read().strip()
              macos_entry = {"signature": macos_sig, "url": f"{base_url}/Taskflow.app.tar.gz"}
              platforms["darwin-universal"] = macos_entry
              platforms["darwin-x86_64"] = macos_entry
              platforms["darwin-aarch64"] = macos_entry

          # Linux x86_64
          linux_sigs = glob.glob("all-artifacts/linux-artifacts/*.AppImage.tar.gz.sig")
          if linux_sigs:
              with open(linux_sigs[0]) as f:
                  linux_sig = f.read().strip()
              linux_tgz_name = os.path.basename(linux_sigs[0]).replace(".sig", "")
              platforms["linux-x86_64"] = {"signature": linux_sig, "url": f"{base_url}/{linux_tgz_name}"}

          # Windows x86_64
          win_sigs = glob.glob("all-artifacts/windows-artifacts/*nsis.zip.sig")
          if win_sigs:
              with open(win_sigs[0]) as f:
                  win_sig = f.read().strip()
              win_zip_name = os.path.basename(win_sigs[0]).replace(".sig", "")
              platforms["windows-x86_64"] = {"signature": win_sig, "url": f"{base_url}/{win_zip_name}"}

          result = {"version": version, "notes": notes, "pub_date": pub_date, "platforms": platforms}
          print(json.dumps(result, indent=2))
          PYEOF

          printf '%s' "$TAG_BODY" > /tmp/tag-body.txt
          python3 /tmp/build-latest.py "$VERSION" "$TAG" "$PUB_DATE" "/tmp/tag-body.txt" > /tmp/latest.json
          cat /tmp/latest.json

          # Delete old latest.json asset if present
          ASSETS=$(curl -s -H "Authorization: token $RELEASES_TOKEN" "$API_BASE/$RELEASE_ID/assets")
          LATEST_ID=$(python3 -c "
          import sys, json
          found = [a['id'] for a in json.loads(sys.argv[1], strict=False) if a['name'] == 'latest.json']
          print(found[0] if found else '')
          " "$ASSETS")
          if [ -n "$LATEST_ID" ]; then
            echo "Deleting old latest.json (asset $LATEST_ID)..."
            curl -s -X DELETE -H "Authorization: token $RELEASES_TOKEN" "$API_BASE/assets/$LATEST_ID"
          fi

          echo "Uploading latest.json..."
          curl -s -X POST \
            -H "Authorization: token $RELEASES_TOKEN" \
            -H "Content-Type: application/json" \
            "https://uploads.github.com/repos/Mimo01/taskflow-releases/releases/$RELEASE_ID/assets?name=latest.json" \
            --data-binary @/tmp/latest.json | python3 -c "
          import sys, json
          data = json.loads(sys.stdin.read(), strict=False)
          print('OK:', data.get('browser_download_url', '(no url)'))
          "

      - name: Update README in releases repo
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_REPO_PAT }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.bare }}"
          RELEASES_API="https://api.github.com/repos/Mimo01/taskflow-releases"

          README_CONTENT="# Taskflow

          ## Download

          ### macOS
          - [Taskflow_${VERSION}_universal.dmg](https://github.com/Mimo01/taskflow-releases/releases/latest/download/Taskflow_${VERSION}_universal.dmg)
          - [Taskflow.app.tar.gz](https://github.com/Mimo01/taskflow-releases/releases/latest/download/Taskflow.app.tar.gz) (for updater)

          ### Linux
          - [taskflow_${VERSION}_amd64.AppImage.tar.gz](https://github.com/Mimo01/taskflow-releases/releases/latest/download/taskflow_${VERSION}_amd64.AppImage.tar.gz) (AppImage)
          - [taskflow_${VERSION}_amd64.deb](https://github.com/Mimo01/taskflow-releases/releases/latest/download/taskflow_${VERSION}_amd64.deb) (Debian/Ubuntu)

          ### Windows
          - [Taskflow_${VERSION}_x64-setup.exe](https://github.com/Mimo01/taskflow-releases/releases/latest/download/Taskflow_${VERSION}_x64-setup.exe) (NSIS installer)
          - [Taskflow_${VERSION}_x64_en-US.msi](https://github.com/Mimo01/taskflow-releases/releases/latest/download/Taskflow_${VERSION}_x64_en-US.msi) (MSI)

          ---
          _Latest release: v${VERSION}_
          "

          README_B64=$(printf '%s' "$README_CONTENT" | base64 -w 0)

          SHA=$(curl -s -H "Authorization: token $RELEASES_TOKEN" \
            "$RELEASES_API/contents/README.md" \
            | python3 -c "import sys,json; print(json.loads(sys.stdin.read(), strict=False).get('sha', ''))")

          UPDATE_RESPONSE=$(curl -s -X PUT \
            -H "Authorization: token $RELEASES_TOKEN" \
            -H "Content-Type: application/json" \
            "$RELEASES_API/contents/README.md" \
            -d "{\"message\": \"docs: update download links to v${VERSION}\", \"content\": \"${README_B64}\", \"sha\": \"${SHA}\"}")

          python3 -c "
          import sys, json
          data = json.loads(sys.argv[1], strict=False)
          if 'content' not in data:
              print('Error updating README:', json.dumps(data, indent=2), file=sys.stderr)
              sys.exit(1)
          print('README updated successfully.')
          " "$UPDATE_RESPONSE"
