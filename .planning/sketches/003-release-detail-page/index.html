<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Release detail — all designs</title>
<link rel="stylesheet" href="../themes/default.css">
<link rel="stylesheet" href="page.css">
<style>
  body { padding-top: 0; }
  #variant-nav { position: sticky; flex-direction: column; gap: 8px; padding: 10px 16px 12px; }
  .grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .grp .gl { width: 64px; flex: none; font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-foreground); }
  #caption { font-size: 13px; color: var(--foreground); padding-left: 70px; line-height: 1.45; }
  #caption .k { color: var(--muted-foreground); }
  #frame { max-width: none; border: 0; min-height: 0; }
  body.constrained { background: var(--muted); }
  body.constrained #frame { margin-block: 16px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  #sketch-tools .on { background: #fff; color: #000; }
  #sketch-tools .sep { width: 1px; align-self: stretch; background: #555; }
  #frame .app-page { height: auto; }
  #frame .scroll { overflow: visible; }
  .narrow { display: flex; gap: 24px; padding: 20px 16px; overflow-x: auto; align-items: flex-start; background: var(--muted); }
  .narrow .wf { flex: none; display: flex; flex-direction: column; gap: 6px; }
  .narrow .cap { font-size: 12px; color: var(--muted-foreground); }
  .narrow .box { background: var(--background); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; color: var(--muted-foreground); }
</style>
</head>
<body>
<div id="variant-nav">
  <div class="grp"><span class="gl">Layout</span>
    <button class="variant-tab active" data-v="a">A · Burnup leads</button>
    <button class="variant-tab" data-v="b">B · 2×2 grid + side column</button>
    <button class="variant-tab" data-v="c">C · Release card (rocket)</button>
  </div>
  <div class="grp"><span class="gl">States</span>
    <button class="variant-tab" data-v="s:loading">Loading</button>
    <button class="variant-tab" data-v="s:noissues">No issues</button>
    <button class="variant-tab" data-v="s:nogitlab">No GitLab</button>
    <button class="variant-tab" data-v="s:nomrs">No MRs · fuzzy milestone</button>
    <button class="variant-tab" data-v="s:released">Released</button>
    <button class="variant-tab" data-v="s:undated">Undated</button>
    <button class="variant-tab" data-v="s:overdue">Overdue</button>
    <button class="variant-tab" data-v="s:short">Burnup &lt; 2 points</button>
  </div>
  <div class="grp"><span class="gl"></span><span class="muted" style="font-size:12px"><kbd>←</kbd> <kbd>→</kbd> step through tabs · widths and the narrow treatment are in the bottom-right control</span></div>
  <div id="caption"></div>
</div>
<div id="frame"><div id="page" data-page></div></div>
<div id="tip"></div>
<div id="sketch-tools">
  <button id="t-theme">◐ Theme</button><span class="sep"></span>
  <button data-w="420">420</button><button data-w="640">640</button><button data-w="900">900</button><button data-w="1280">1280</button><button data-w="none" class="on">Full</button><span class="sep"></span>
  <span style="opacity:.7">Narrow</span><button data-n="n1" class="on" title="N1 · Stack: actions wrap under the title; graphs 3 → 2 → 1 columns">Stack</button><button data-n="n2" title="N2 · Compact: icon actions top-right; type + donut side by side until 440px; shorter burnup">Compact</button><span class="sep"></span>
  <button id="t-annot">✎ Notes</button>
</div>
<script src="render.js"></script>
<script src="../004-detail-edge-states/states.js"></script>
<script>
// One hub for sketches 003–005. States and narrow tabs use layout A (provisional) until a layout is picked.
const LAYOUT = {
  a: { o: { layout: 'a', facts: 'inline', type: 'columns' },
       cap: 'Facts inline in the header line · burnup full width · then assignee · type columns · MR donut in one row · labels + mismatches side by side · task table.' },
  b: { o: { layout: 'b', facts: 'row', type: 'waffle' },
       cap: 'Facts as their own chip row · graphs in a 2×2 grid · labels + mismatches in a right column · type graph is a waffle (one square per issue).' },
  c: { o: { layout: 'c', facts: 'icons', type: 'tiles' },
       cap: 'Rocket card (as on the Releases page) holds the done bar + burnup · facts icon + value only (label in tooltip) · type graph as tiles.' },
};
const STATE_CAP = {
  loading: 'Header from cache; every graph slot keeps its final size with a skeleton — nothing shifts when data arrives.',
  noissues: 'Release with no issues yet: one muted "No issues" per slot, empty done track, Create branch inside its fact.',
  nogitlab: 'GitLab not configured: GitLab facts, MR donut and labels disappear; the graph row becomes two columns.',
  nomrs: 'Fuzzy milestone (dashed, orange, candidate in tooltip), branch check failed + Retry, "No MRs in this milestone".',
  released: 'Green Released pill, branch "Released · v33.4.0", Merged back appears; burnup ends on the release date.',
  undated: 'Amber "No date"; milestone/branch explain why they can\'t be created; burnup starts at the earliest issue.',
  overdue: 'Red Overdue; burnup axis ends today, Release marker before TODAY; problems (branch missing, labels) carry tone.',
  short: 'Previous version shipped yesterday: burnup slot shows a placeholder sentence instead of a one-dot chart.',
};
const page = document.getElementById('page');
const cap = document.getElementById('caption');
let current = 'a';
function show(v) {
  current = v;
  const [kind, id] = v.includes(':') ? v.split(':') : ['l', v];
  if (kind === 'l') {
    renderPage(page, baseRelease(), LAYOUT[id].o);
    cap.innerHTML = LAYOUT[id].cap;
  } else if (kind === 's') {
    const r = baseRelease();
    STATES[id](r);
    renderPage(page, r, LAYOUT.a.o);
    cap.innerHTML = `${STATE_CAP[id]} <span class="k">(on layout A)</span>`;
  }
}
initChrome(show);
// width + narrow treatment live in the toolbar and apply to every tab
const frame = document.getElementById('frame');
document.querySelectorAll('[data-w]').forEach((b) => (b.onclick = () => {
  document.querySelectorAll('[data-w]').forEach((x) => x.classList.toggle('on', x === b));
  frame.style.maxWidth = b.dataset.w === 'none' ? 'none' : `${b.dataset.w}px`;
  document.body.classList.toggle('constrained', b.dataset.w !== 'none');
  requestAnimationFrame(redrawAll);
}));
document.querySelectorAll('[data-n]').forEach((b) => (b.onclick = () => {
  document.querySelectorAll('[data-n]').forEach((x) => x.classList.toggle('on', x === b));
  frame.classList.toggle('n2', b.dataset.n === 'n2');
  requestAnimationFrame(redrawAll);
}));
const tabs = [...document.querySelectorAll('.variant-tab')];
addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const i = tabs.findIndex((t) => t.dataset.v === current);
  const next = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
  next.click();
  scrollTo(0, 0);
});
show('a');
</script>
</body>
</html>
