<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sketch 004 — Release detail edge states</title>
<link rel="stylesheet" href="../themes/default.css">
<link rel="stylesheet" href="../003-release-detail-page/page.css">
</head>
<body>
<div id="variant-nav">
  <button class="variant-tab active" data-v="loading">Loading</button>
  <button class="variant-tab" data-v="noissues">No issues</button>
  <button class="variant-tab" data-v="nogitlab">No GitLab</button>
  <button class="variant-tab" data-v="nomrs">No MRs · fuzzy milestone</button>
  <button class="variant-tab" data-v="released">Released</button>
  <button class="variant-tab" data-v="undated">Undated</button>
  <button class="variant-tab" data-v="overdue">Overdue · problems</button>
  <button class="variant-tab" data-v="short">Burnup &lt; 2 points</button>
</div>
<div id="frame"><div id="page" data-page></div></div>
<div id="tip"></div>
<div id="sketch-tools">
  <button id="t-theme">◐ Theme</button>
  <button data-w="640">640</button><button data-w="900">900</button><button data-w="1280">1280</button><button data-w="1600">Full</button>
  <button id="t-annot">✎ Notes</button>
</div>
<script src="../003-release-detail-page/render.js"></script>
<script src="states.js"></script>
<script>
// Built on sketch 003 variant A (provisional winner). Each state mutates the base placeholder release.
const show = (v) => {
  const r = baseRelease();
  const note = STATES[v](r);
  renderPage(document.getElementById('page'), r, { layout: 'a', facts: 'inline', type: 'columns', note: `<b>${document.querySelector(`[data-v=${v}]`).textContent}.</b> ${note}` });
};
initChrome(show);
document.body.classList.add('notes');
show('loading');
</script>
</body>
</html>
